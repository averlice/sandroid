name: Keep voice data out of Git
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/check-repo-data.py
